document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* hebrew */\n@font-face {\n  font-family: 'Frank Ruhl Libre';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"e46a36c3-5717-434d-99a8-b292c2b655eb\") format('woff2');\n  unicode-range: U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Frank Ruhl Libre';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"c481cb99-5988-4cec-88c6-686f24ae2241\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Frank Ruhl Libre';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"7e4053b2-035d-4c36-8907-ff23f408ef91\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  * { box-sizing: border-box; }\n  body { margin: 0; }\n  ::selection { background: rgba(120,110,90,0.25); }\n  a { text-decoration: none; }\n  a.body-link { text-decoration: underline; text-underline-offset: 3px; }\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"{{ pageStyle }}\">\n  <nav style=\"{{ navStyle }}\">\n    <button sc-camel-on-click=\"{{ goHome }}\" style=\"{{ brandStyle }}\">Avalanch-e<\u002Fbutton>\n    <div style=\"display:flex;align-items:center;gap:22px\">\n      <button sc-camel-on-click=\"{{ goHome }}\" style=\"{{ navLinkStyle }}\">Archive<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ goAbout }}\" style=\"{{ navLinkStyle }}\">About<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ toggleDark }}\" style=\"{{ darkToggleStyle }}\">{{ darkToggleLabel }}<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fnav>\n\n  <main style=\"{{ mainStyle }}\">\n    <sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n      <div>\n        <sc-for list=\"{{ groups }}\" as=\"group\" hint-placeholder-count=\"2\">\n          <section style=\"{{ yearSectionStyle }}\">\n            <div style=\"{{ yearLabelStyle }}\">{{ group.year }}<\u002Fdiv>\n          <div style=\"{{ dividerStyle }}\"><\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column\">\n              <sc-for list=\"{{ group.items }}\" as=\"post\" hint-placeholder-count=\"3\">\n                <button sc-camel-on-click=\"{{ post.select }}\" style=\"{{ postRowStyle }}\">\n                  <span style=\"{{ postTitleStyle }}\">{{ post.title }}<\u002Fspan>\n                  <span style=\"{{ postDateStyle }}\">{{ post.dateLabel }}<\u002Fspan>\n                  <sc-if value=\"{{ showExcerpts }}\" hint-placeholder-val=\"{{ true }}\">\n                    <span style=\"{{ postExcerptStyle }}\">{{ post.excerpt }}<\u002Fspan>\n                  <\u002Fsc-if>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsection>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isPost }}\" hint-placeholder-val=\"{{ false }}\">\n      <article style=\"{{ articleStyle }}\">\n        <button sc-camel-on-click=\"{{ goHome }}\" style=\"{{ backLinkStyle }}\">← Avalanch-e<\u002Fbutton>\n        <h1 style=\"{{ postHeadingStyle }}\">{{ activePost.title }}<\u002Fh1>\n        <div style=\"{{ postMetaStyle }}\">{{ activePost.dateLabel }}<\u002Fdiv>\n        <div style=\"{{ dividerStyle }}\"><\u002Fdiv>\n        <div style=\"{{ bodyStyle }}\">\n          <sc-for list=\"{{ activePost.paragraphs }}\" as=\"para\" hint-placeholder-count=\"4\">\n            <p style=\"{{ paraStyle }}\">{{ para }}<\u002Fp>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Farticle>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isAbout }}\" hint-placeholder-val=\"{{ false }}\">\n      <article style=\"{{ articleStyle }}\">\n        <button sc-camel-on-click=\"{{ goHome }}\" style=\"{{ backLinkStyle }}\">← Avalanch-e<\u002Fbutton>\n        <h1 style=\"{{ postHeadingStyle }}\">About<\u002Fh1>\n        <div style=\"{{ bodyStyle }}\">\n          <p style=\"{{ paraStyle }}\">Avalanch-e is a pen name. Not a brand, not a platform — a slope, and what gathers speed on the way down.<\u002Fp>\n          <p style=\"{{ paraStyle }}\">These are fragments, not arguments. The thesis defends itself; the aphorism does not care to. Say the sharp thing and leave before the seminar starts.<\u002Fp>\n          <p style=\"{{ paraStyle }}\">Nothing here is peer-reviewed, footnoted, or sorry about it.<\u002Fp>\n          <p style=\"{{ paraStyle }}\">Read out of order. Disagree freely. Quote without permission — that was always the point of writing it down.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Farticle>\n    <\u002Fsc-if>\n  <\u002Fmain>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;: {&quot;width&quot;: 900, &quot;height&quot;: 900}, &quot;showExcerpts&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Content&quot;}, &quot;readingWidth&quot;: {&quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 65, &quot;min&quot;: 50, &quot;max&quot;: 80, &quot;step&quot;: 2, &quot;unit&quot;: &quot;ch&quot;, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Layout&quot;}, &quot;defaultDarkMode&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Theme&quot;}}\">\nconst POSTS = [\n  { id: 'cool-memories-i', year: 2026, dateSort: '2026-03-14', dateLabel: 'March 14, 2026', title: 'Cool Memories I', excerpt: 'Fragments on simulation, seduction, and the death of the real.', paragraphs: [\n    'The obscenity of our age is not that everything is hidden, but that everything is exposed — the pornography of total visibility, where even the secret has been made to perform its secrecy for an audience.',\n    'We were promised liberation and were given transparency instead, which is a much crueler thing. A secret can be kept. A performance of having nothing to hide can never rest.',\n    'Truth has not been suppressed; it has been multiplied past the point of use, like a currency printed until it buys nothing. Hyperinflation of the fact.',\n    'Seduction is the only intelligence left to us. Explanation is for those who have already lost.',\n    'The map preceded the territory a long time ago. What we now mistake for reality is the territory\\'s attempt to resemble its own map, badly, and gratefully.'\n  ]},\n  { id: 'on-authenticity', year: 2026, dateSort: '2026-01-03', dateLabel: 'January 3, 2026', title: 'Against Authenticity', excerpt: 'The self that must announce itself as real has already lost the argument.', paragraphs: [\n    'Authenticity is the last mask that claims not to be one. Every other mask admits its status; this one insists it is the face.',\n    'To be told \"just be yourself\" is to receive an order disguised as a permission. Try refusing it and discover how little permission was actually on offer.',\n    'The confessional mode — the diary, the personal essay, the deathbed sincerity performed at thirty — is not the opposite of performance. It is performance that has learned to despise its own name.',\n    'I trust the liar who knows he is lying more than the sincere man who has simply automated his sincerity. At least the liar is still awake.'\n  ]},\n  { id: 'on-the-death-of-god-and-other-good-news', year: 2025, dateSort: '2025-11-02', dateLabel: 'November 2, 2025', title: 'On the Death of God, and Other Good News', excerpt: 'We did not kill him. We simply stopped needing an alibi.', paragraphs: [\n    'God did not die of an argument. No god ever has. He died of irrelevance, which is a much slower and more humiliating death than the one philosophy likes to stage for him.',\n    'What frightens the moralist is not that god is dead but that his absence changed nothing on Tuesday morning. The bakery opened. The trains ran late. Meaning did not evacuate the premises — it simply stopped waiting for a landlord.',\n    'Those who mourn the death of god are usually mourning the death of an excuse: the excuse not to have invented their own values, their own severities, their own reasons to rise before noon.',\n    'I do not ask you to become an atheist. I ask you to notice how much work the word \"sin\" was doing for you, and whether you are willing to do that work yourself now.'\n  ]},\n  { id: 'on-cruelty-as-a-form-of-honesty', year: 2025, dateSort: '2025-07-19', dateLabel: 'July 19, 2025', title: 'On Cruelty as a Form of Honesty', excerpt: 'Kindness is often just cowardice with better public relations.', paragraphs: [\n    'Every ethics of niceness is secretly an ethics of avoidance: better to withhold the true sentence than risk the discomfort of having said it.',\n    'I do not recommend cruelty. I recommend noticing how much of what passes for kindness is simply the fear of consequence wearing a gentler word.',\n    'The cruelest man I ever met told the truth so plainly that people mistook his honesty for malice, because they had never encountered the former unaccompanied by flattery and assumed it must be the latter.',\n    'A compliment costs nothing and is therefore worth exactly that. Save your praise for what has actually earned the risk of your disapproval.'\n  ]},\n  { id: 'notes-on-boredom-as-revolt', year: 2025, dateSort: '2025-04-08', dateLabel: 'April 8, 2025', title: 'Notes on Boredom as Revolt', excerpt: 'The bored man is the last person the algorithm cannot reach.', paragraphs: [\n    'Boredom used to be a private failure. Now it is nearly an act of resistance — the one remaining state the feed cannot monetize, because it produces no click, no scroll, no data worth harvesting.',\n    'To be entertained continuously is to be governed continuously. The tyrant\\'s oldest trick was bread and circuses; ours does not even require the bread.',\n    'I have come to suspect my own restlessness. Each time I reach for the device out of boredom, I am not fleeing an empty moment — I am fleeing the only moment in which I might have noticed something true about my life.',\n    'Cultivate boredom the way a monk cultivates silence. It is not empty. It is simply not for sale yet.'\n  ]},\n  { id: 'aphorisms-against-the-thesis', year: 2025, dateSort: '2025-01-22', dateLabel: 'January 22, 2025', title: 'Aphorisms Against the Thesis', excerpt: 'A short defense of the fragment over the argument.', paragraphs: [\n    'An argument tries to survive its critics. An aphorism does not care whether it survives — it has already said the thing and left the room.',\n    'The academic paper is a coffin built slowly, with footnotes for nails. I would rather leave a wound than a monument.',\n    'Systems are for those afraid of being caught contradicting themselves. I contradict myself constantly. It is the only sign I am still thinking rather than reciting.',\n    'A truth that requires forty pages to defend was probably not true enough to begin with. Say the sharp thing. Let the reader do the forty pages, if they must.',\n    'I do not build. I quarry. Let the masons come later, if they dare, and if the stone lets them.'\n  ]},\n  { id: 'on-the-obscenity-of-optimization', year: 2024, dateSort: '2024-09-30', dateLabel: 'September 30, 2024', title: 'On the Obscenity of Optimization', excerpt: 'The self as a spreadsheet is the final joke played on the soul.', paragraphs: [\n    'We have arrived at a civilization that measures the sunrise in lumens and calls the accounting \"mindfulness.\"',\n    'Optimization is not a neutral method applied to a life; it is a metaphysics smuggled in through the back door of a to-do list, one that quietly decides in advance that the good life is the efficient one.',\n    'The most radical thing available to a person today may be to waste an afternoon on purpose, contributing nothing, producing nothing, and to feel no need to caption it.',\n    'Every habit tracker is a small confession booth with no priest and no absolution — only a streak, and the terror of breaking it.'\n  ]},\n  { id: 'on-forgetting-well', year: 2024, dateSort: '2024-05-11', dateLabel: 'May 11, 2024', title: 'On Forgetting Well', excerpt: 'Memory is not a virtue. It is a habit we have failed to interrogate.', paragraphs: [\n    'We have built a culture that treats forgetting as a moral failure and remembering as a moral achievement, without ever asking whether a thing deserved to be kept.',\n    'The archive is not innocent. It preserves what power finds useful to preserve, and calls the rest negligence.',\n    'I have forgotten people I once thought I could not live without, and lived. This is either a scandal or the entire point; I no longer bother deciding which.',\n    'To forget on purpose — to let a wound close without erecting a monument over it — is not betrayal. It is simply refusing to let the dead do more governing than the living.'\n  ]}\n];\n\nclass Component extends DCLogic {\n  state = { view: 'home', activeId: null, dark: null };\n\n  componentDidMount() {\n    let dark = this.props.defaultDarkMode ?? false;\n    try {\n      const stored = localStorage.getItem('avalanche-dark-mode');\n      if (stored !== null) dark = stored === '1';\n    } catch (e) {}\n    this.setState({ dark });\n  }\n\n  goHome = () => { window.scrollTo(0, 0); this.setState({ view: 'home', activeId: null }); };\n  goAbout = () => { window.scrollTo(0, 0); this.setState({ view: 'about', activeId: null }); };\n  selectPost = (id) => { window.scrollTo(0, 0); this.setState({ view: 'post', activeId: id }); };\n  toggleDark = () => {\n    this.setState(s => {\n      const next = !s.dark;\n      try { localStorage.setItem('avalanche-dark-mode', next ? '1' : '0'); } catch (e) {}\n      return { dark: next };\n    });\n  };\n\n  renderVals() {\n    const dark = this.state.dark ?? (this.props.defaultDarkMode ?? false);\n    const bg = dark ? 'oklch(0.14 0 0)' : 'oklch(0.985 0 0)';\n    const fg = dark ? 'oklch(0.95 0 0)' : 'oklch(0.1 0 0)';\n    const muted = dark ? 'oklch(0.6 0 0)' : 'oklch(0.42 0 0)';\n    const border = dark ? 'oklch(0.32 0 0)' : 'oklch(0.82 0 0)';\n    const rowHover = dark ? 'oklch(0.2 0 0)' : 'oklch(0.94 0 0)';\n    const accent = fg;\n\n    const fontBody = \"'Frank Ruhl Libre', Georgia, 'Times New Roman', serif\";\n    const fontMeta = \"'Archivo', Helvetica, Arial, sans-serif\";\n    const fontTitle = \"'Archivo', Helvetica, Arial, sans-serif\";\n    const fontExcerpt = \"'Archivo', Helvetica, Arial, sans-serif\";\n    const cold = dark ? 'oklch(0.55 0.05 225)' : 'oklch(0.62 0.06 225)';\n    const readingWidth = (this.props.readingWidth ?? 65) + 'ch';\n    const showExcerpts = this.props.showExcerpts ?? true;\n\n    const sorted = [...POSTS].sort((a, b) => b.dateSort.localeCompare(a.dateSort));\n    const years = [...new Set(sorted.map(p => p.year))].sort((a, b) => b - a);\n    const groups = years.map(year => ({\n      year,\n      items: sorted.filter(p => p.year === year).map(p => ({\n        ...p,\n        select: () => this.selectPost(p.id)\n      }))\n    }));\n\n    const activePost = POSTS.find(p => p.id === this.state.activeId) || null;\n\n    return {\n      pageStyle: `min-height:100vh;background:${bg};color:${fg};font-family:${fontBody};transition:background .15s ease,color .15s ease`,\n      navStyle: `display:flex;align-items:center;justify-content:space-between;max-width:900px;margin:0 auto;padding:40px 24px 24px;border-bottom:1px solid ${border}`,\n      brandStyle: `background:none;border:none;padding:0;font-family:${fontTitle};font-size:21px;font-weight:800;color:${fg};cursor:pointer;letter-spacing:0.06em;text-transform:uppercase`,\n      navLinkStyle: `background:none;border:none;padding:0;font-family:${fontMeta};font-weight:500;font-size:12px;letter-spacing:0.14em;color:${muted};cursor:pointer;text-transform:uppercase`,\n      darkToggleStyle: `background:none;border:1px solid ${border};border-radius:0;padding:5px 12px;font-family:${fontMeta};font-weight:500;font-size:11px;letter-spacing:0.12em;color:${muted};cursor:pointer;text-transform:uppercase`,\n      darkToggleLabel: dark ? 'Light' : 'Dark',\n      mainStyle: `max-width:900px;margin:0 auto;padding:8px 24px 120px`,\n      yearSectionStyle: `padding-top:52px`,\n      yearLabelStyle: `font-family:${fontTitle};font-size:15px;font-weight:800;letter-spacing:0.04em;color:${accent};margin-bottom:10px;text-transform:uppercase`,\n      dividerStyle: `width:32px;height:2px;background:${cold};margin-bottom:20px`,\n      postRowStyle: `display:flex;flex-direction:column;align-items:flex-start;gap:4px;background:none;border:none;border-bottom:1px solid ${border};width:100%;text-align:left;padding:20px 0;cursor:pointer;font-family:${fontBody}`,\n      postTitleStyle: `font-family:${fontTitle};font-size:17px;font-weight:800;color:${fg};letter-spacing:0.01em;text-transform:uppercase`,\n      postDateStyle: `font-family:${fontMeta};font-weight:500;font-size:11.5px;color:${muted};letter-spacing:0.1em;text-transform:uppercase`,\n      postExcerptStyle: `font-family:${fontExcerpt};font-size:14.5px;font-style:italic;font-weight:400;color:${muted};margin-top:2px`,\n      articleStyle: `max-width:${readingWidth};margin:0 auto;padding-top:56px`,\n      backLinkStyle: `background:none;border:none;padding:0;font-family:${fontMeta};font-weight:500;font-size:12px;letter-spacing:0.1em;text-transform:uppercase;color:${muted};cursor:pointer;margin-bottom:40px;display:block`,\n      postHeadingStyle: `font-family:${fontTitle};font-size:30px;line-height:1.3;font-weight:800;margin:0 0 14px;color:${fg};letter-spacing:0.01em;text-transform:uppercase`,\n      postMetaStyle: `font-family:${fontMeta};font-weight:500;font-size:12px;color:${muted};margin-bottom:48px;letter-spacing:0.1em;text-transform:uppercase`,\n      bodyStyle: `display:flex;flex-direction:column;gap:22px`,\n      paraStyle: `font-size:19px;line-height:1.85;font-weight:400;color:${fg};margin:0;text-wrap:pretty`,\n      isHome: this.state.view === 'home',\n      isPost: this.state.view === 'post' && !!activePost,\n      isAbout: this.state.view === 'about',\n      groups,\n      showExcerpts,\n      activePost,\n      goHome: this.goHome,\n      goAbout: this.goAbout,\n      toggleDark: this.toggleDark\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
