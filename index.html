<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avalanch-e</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,800;1,400&family=Archivo+Black&family=Frank+Ruhl+Libre:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  ::selection { background: rgba(120,110,90,0.25); }
  a { text-decoration: none; }

  :root {
    --bg: oklch(0.985 0 0);
    --fg: oklch(0.1 0 0);
    --muted: oklch(0.42 0 0);
    --border: oklch(0.82 0 0);
    --cold: oklch(0.62 0.06 225);
  }
  [data-theme="dark"] {
    --bg: oklch(0.14 0 0);
    --fg: oklch(0.95 0 0);
    --muted: oklch(0.6 0 0);
    --border: oklch(0.32 0 0);
    --cold: oklch(0.55 0.05 225);
  }

  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Frank Ruhl Libre', Georgia, 'Times New Roman', serif;
    transition: background .15s ease, color .15s ease;
  }

  nav {
    display: flex; align-items: center; justify-content: space-between;
    max-width: 900px; margin: 0 auto; padding: 40px 24px 24px;
    border-bottom: 1px solid var(--border);
  }
  .brand {
    background: none; border: none; padding: 0;
    font-family: 'Archivo', Helvetica, Arial, sans-serif;
    font-size: 21px; font-weight: 800; color: var(--fg);
    cursor: pointer; letter-spacing: 0.06em; text-transform: uppercase;
  }
  .nav-links { display: flex; align-items: center; gap: 22px; }
  .nav-link {
    background: none; border: none; padding: 0;
    font-family: 'Archivo', Helvetica, Arial, sans-serif;
    font-weight: 500; font-size: 12px; letter-spacing: 0.14em;
    color: var(--muted); cursor: pointer; text-transform: uppercase;
  }
  .dark-toggle {
    background: none; border: 1px solid var(--border); border-radius: 0;
    padding: 5px 12px; font-family: 'Archivo', Helvetica, Arial, sans-serif;
    font-weight: 500; font-size: 11px; letter-spacing: 0.12em;
    color: var(--muted); cursor: pointer; text-transform: uppercase;
  }

  main { max-width: 900px; margin: 0 auto; padding: 8px 24px 120px; }

  .year-section { padding-top: 52px; }
  .year-label {
    font-family: 'Archivo', Helvetica, Arial, sans-serif;
    font-size: 15px; font-weight: 800; letter-spacing: 0.04em;
    color: var(--fg); margin-bottom: 10px; text-transform: uppercase;
  }
  .divider { width: 32px; height: 2px; background: var(--cold); margin-bottom: 20px; }

  .post-row {
    display: flex; flex-direction: column; align-items: flex-start; gap: 4px;
    background: none; border: none; border-bottom: 1px solid var(--border);
    width: 100%; text-align: left; padding: 20px 0; cursor: pointer;
    font-family: 'Frank Ruhl Libre', Georgia, serif;
  }
  .post-title {
    font-family: 'Archivo', Helvetica, Arial, sans-serif;
    font-size: 17px; font-weight: 800; color: var(--fg);
    letter-spacing: 0.01em; text-transform: uppercase;
  }
  .post-date {
    font-family: 'Archivo', Helvetica, Arial, sans-serif;
    font-weight: 500; font-size: 11.5px; color: var(--muted);
    letter-spacing: 0.1em; text-transform: uppercase;
  }
  .post-excerpt {
    font-family: 'Archivo', Helvetica, Arial, sans-serif;
    font-size: 14.5px; font-style: italic; font-weight: 400;
    color: var(--muted); margin-top: 2px;
  }

  article { max-width: 65ch; margin: 0 auto; padding-top: 56px; }
  .back-link {
    background: none; border: none; padding: 0;
    font-family: 'Archivo', Helvetica, Arial, sans-serif;
    font-weight: 500; font-size: 12px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--muted); cursor: pointer;
    margin-bottom: 40px; display: block;
  }
  .post-heading {
    font-family: 'Archivo', Helvetica, Arial, sans-serif;
    font-size: 30px; line-height: 1.3; font-weight: 800;
    margin: 0 0 14px; color: var(--fg); letter-spacing: 0.01em;
    text-transform: uppercase;
  }
  .post-meta {
    font-family: 'Archivo', Helvetica, Arial, sans-serif;
    font-weight: 500; font-size: 12px; color: var(--muted);
    margin-bottom: 48px; letter-spacing: 0.1em; text-transform: uppercase;
  }
  .body { display: flex; flex-direction: column; gap: 22px; }
  .body p { font-size: 19px; line-height: 1.85; font-weight: 400; color: var(--fg); margin: 0; text-wrap: pretty; }
</style>
</head>
<body>
  <nav>
    <button class="brand" onclick="goHome()">Avalanch-e</button>
    <div class="nav-links">
      <button class="nav-link" onclick="goHome()">Archive</button>
      <button class="nav-link" onclick="goAbout()">About</button>
      <button class="dark-toggle" id="darkToggle" onclick="toggleDark()">Dark</button>
    </div>
  </nav>
  <main id="main"></main>

  <script src="posts.js"></script>
  <script>
    const SHOW_EXCERPTS = true; // set to false to hide excerpts on the home page

    function escapeHtml(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function renderHome() {
      const sorted = [...POSTS].sort((a, b) => b.dateSort.localeCompare(a.dateSort));
      const years = [...new Set(sorted.map(p => p.dateSort.slice(0, 4)))];
      let html = '';
      for (const year of years) {
        html += `<section class="year-section"><div class="year-label">${year}</div><div class="divider"></div><div>`;
        for (const post of sorted.filter(p => p.dateSort.slice(0, 4) === year)) {
          html += `
            <button class="post-row" onclick="goPost('${post.id}')">
              <span class="post-title">${escapeHtml(post.title)}</span>
              <span class="post-date">${escapeHtml(post.dateLabel)}</span>
              ${SHOW_EXCERPTS ? `<span class="post-excerpt">${escapeHtml(post.excerpt)}</span>` : ''}
            </button>`;
        }
        html += `</div></section>`;
      }
      document.getElementById('main').innerHTML = html;
    }

    function renderPost(id) {
      const post = POSTS.find(p => p.id === id);
      if (!post) { renderHome(); return; }
      document.getElementById('main').innerHTML = `
        <article>
          <button class="back-link" onclick="goHome()">← Avalanch-e</button>
          <h1 class="post-heading">${escapeHtml(post.title)}</h1>
          <div class="post-meta">${escapeHtml(post.dateLabel)}</div>
          <div class="divider"></div>
          <div class="body">
            ${post.paragraphs.map(p => `<p>${escapeHtml(p)}</p>`).join('')}
          </div>
        </article>`;
    }

    function renderAbout() {
      document.getElementById('main').innerHTML = `
        <article>
          <button class="back-link" onclick="goHome()">← Avalanch-e</button>
          <h1 class="post-heading">About</h1>
          <div class="body">
            <p>Avalanch-e is a pen name. Not a brand, not a platform — a slope, and what gathers speed on the way down.</p>
            <p>These are fragments, not arguments. The thesis defends itself; the aphorism does not care to. Say the sharp thing and leave before the seminar starts.</p>
            <p>Nothing here is peer-reviewed, footnoted, or sorry about it.</p>
            <p>Read out of order. Disagree freely. Quote without permission — that was always the point of writing it down.</p>
          </div>
        </article>`;
    }

    function goHome() { window.scrollTo(0, 0); location.hash = ''; }
    function goAbout() { window.scrollTo(0, 0); location.hash = 'about'; }
    function goPost(id) { window.scrollTo(0, 0); location.hash = 'post/' + id; }

    function route() {
      const hash = location.hash.slice(1);
      if (hash === 'about') renderAbout();
      else if (hash.startsWith('post/')) renderPost(hash.slice(5));
      else renderHome();
    }

    function applyDarkState(dark) {
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      document.getElementById('darkToggle').textContent = dark ? 'Light' : 'Dark';
    }
    function toggleDark() {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      const next = !isDark;
      try { localStorage.setItem('avalanche-dark-mode', next ? '1' : '0'); } catch (e) {}
      applyDarkState(next);
    }

    let initialDark = false;
    try {
      const stored = localStorage.getItem('avalanche-dark-mode');
      if (stored !== null) initialDark = stored === '1';
    } catch (e) {}
    applyDarkState(initialDark);

    window.addEventListener('hashchange', route);
    route();
  </script>
</body>
</html>
